<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pazapa Phonics – Let's Discover the Sound /s/</title>
<style>
  :root{
    --pazapa-blue:#36BBD6;
    --pazapa-blue-dark:#1B7E92;
    --pazapa-green:#C9D646;
    --pazapa-yellow:#FCC104;
    --pazapa-red:#E6352B;
    --pazapa-grey-light:#EBEBEB;
    --pazapa-grey-dark:#2E2E2D;
    --bg:#FFFDF7;
    --radius:18px;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    background:var(--bg);
    color:var(--pazapa-grey-dark);
    font-family:"Open Sans", Arial, sans-serif;
    -webkit-text-size-adjust:100%;
  }

  h1,h2,h3{
    font-family:"Filson Soft","Open Sans", Arial, sans-serif;
    font-weight:900;
    color:var(--pazapa-blue-dark);
    margin:0 0 .5rem 0;
  }

  .app{
    max-width:640px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding:1rem 1rem 2rem 1rem;
  }

  /* ---------- HEADER ---------- */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:.75rem;
    padding:.5rem .25rem 1.25rem .25rem;
  }

  .logo-slot{
    display:flex;
    align-items:center;
    gap:.5rem;
    min-height:44px;
  }
  .logo-slot img{
    max-height:40px;
    width:auto;
    display:block;
  }
  .logo-fallback{
    font-family:"Filson Soft","Open Sans",Arial,sans-serif;
    font-weight:900;
    font-size:1.1rem;
    color:var(--pazapa-blue-dark);
  }

  .lesson-label{
    font-size:.85rem;
    font-weight:700;
    color:var(--pazapa-blue-dark);
    background:rgba(54,187,214,.12);
    border-radius:999px;
    padding:.35rem .75rem;
    white-space:nowrap;
  }

  /* ---------- MAIN ---------- */
  main{
    flex:1;
    display:flex;
    flex-direction:column;
  }

  .step{
    display:none;
    flex:1;
    flex-direction:column;
    align-items:center;
    text-align:center;
    background:#fff;
    border:1px solid var(--pazapa-grey-light);
    border-radius:var(--radius);
    padding:1.75rem 1.25rem;
    gap:1.1rem;
    animation:fadeUp .35s ease;
  }
  .step.active{display:flex;}

  @keyframes fadeUp{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }
  @media (prefers-reduced-motion: reduce){
    .step{animation:none;}
  }

  .step h2{
    font-size:clamp(1.3rem, 4.5vw, 1.9rem);
  }

  .step p.instruction{
    font-size:clamp(1rem, 3vw, 1.15rem);
    line-height:1.6;
    max-width:32ch;
  }

  .optional-tag{
    font-size:.8rem;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.03em;
    color:var(--pazapa-blue-dark);
    background:rgba(252,193,4,.25);
    border-radius:999px;
    padding:.3rem .8rem;
  }

  /* ---------- CHARACTER SLOT ---------- */
  .character-slot{
    width:100%;
    max-width:260px;
    min-height:140px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--pazapa-grey-light);
    border-radius:14px;
    overflow:hidden;
  }
  .character-slot img{
    width:100%;
    height:100%;
    object-fit:contain;
    max-width:220px;
  }
  .character-slot .placeholder-text{
    font-size:.85rem;
    color:var(--pazapa-grey-dark);
    opacity:.6;
    padding:1rem;
  }

  .character-row{
    display:flex;
    gap:1rem;
    justify-content:center;
    width:100%;
    flex-wrap:wrap;
  }
  .character-row .character-slot{
    flex:1 1 110px;
    max-width:140px;
    min-height:150px;
  }

  /* ---------- SOUND BUTTON (isolated /s/) ---------- */
  .sound-btn{
    width:130px;
    height:130px;
    border-radius:50%;
    border:none;
    background:var(--pazapa-blue);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:transform .15s ease, background .15s ease;
  }
  .sound-btn svg{width:52px; height:52px;}
  .sound-btn:disabled{
    background:var(--pazapa-grey-light);
    color:var(--pazapa-grey-dark);
    opacity:.55;
    cursor:not-allowed;
  }
  .sound-btn:not(:disabled):hover,
  .sound-btn:not(:disabled):active{
    transform:scale(1.05);
  }

  .replay-btn{
    display:inline-flex;
    align-items:center;
    gap:.4rem;
    min-height:48px;
    padding:.5rem 1.1rem;
    border-radius:999px;
    border:2px solid var(--pazapa-blue);
    background:#fff;
    color:var(--pazapa-blue-dark);
    font-weight:800;
    font-size:.9rem;
    cursor:pointer;
  }
  .replay-btn:disabled{
    border-color:var(--pazapa-grey-light);
    color:var(--pazapa-grey-dark);
    opacity:.5;
    cursor:not-allowed;
  }
  .replay-btn svg{width:18px; height:18px;}

  /* ---------- WORD CARDS ---------- */
  .word-grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:.9rem;
    width:100%;
  }
  .word-card{
    background:var(--bg);
    border:1px solid var(--pazapa-grey-light);
    border-radius:14px;
    padding:.75rem;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:.5rem;
  }
  .word-card .img-frame{
    width:100%;
    height:90px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--pazapa-grey-light);
    border-radius:10px;
    overflow:hidden;
  }
  .word-card .img-frame img{
    width:100%;
    height:100%;
    object-fit:contain;
    max-width:220px;
  }
  .word-card .img-frame .placeholder-text{
    font-size:.72rem;
    opacity:.6;
    padding:.3rem;
  }
  .word-card .word-label{
    font-weight:700;
    font-size:.9rem;
  }
  .word-card .speaker-btn{
    min-width:44px;
    min-height:44px;
    border-radius:50%;
    border:none;
    background:var(--pazapa-blue);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  .word-card .speaker-btn svg{width:20px; height:20px;}
  .word-card .speaker-btn:disabled{
    background:var(--pazapa-grey-light);
    color:var(--pazapa-grey-dark);
    opacity:.55;
    cursor:not-allowed;
  }

  /* ---------- RECORDING ---------- */
  .record-controls{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:.8rem;
  }
  .record-btn{
    min-height:52px;
    padding:.7rem 1.4rem;
    border-radius:999px;
    border:none;
    background:var(--pazapa-blue);
    color:#fff;
    font-weight:800;
    font-size:1rem;
    display:inline-flex;
    align-items:center;
    gap:.5rem;
    cursor:pointer;
  }
  .record-btn.recording{
    background:var(--pazapa-red);
  }
  .record-btn svg{width:20px; height:20px;}

  .playback-row{
    display:flex;
    align-items:center;
    gap:.6rem;
    flex-wrap:wrap;
    justify-content:center;
  }

  audio.playback-audio{
    height:40px;
  }

  /* ---------- BUTTONS (general) ---------- */
  .btn{
    font-size:clamp(.9rem, 2.5vw, 1rem);
    font-weight:800;
    min-height:2.9rem;
    padding:.7rem 1.6rem;
    border-radius:999px;
    border:none;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:.4rem;
  }
  .btn-primary{
    background:var(--pazapa-blue);
    color:#fff;
  }
  .btn-primary:hover{background:var(--pazapa-blue-dark);}
  .btn-primary:disabled{
    background:var(--pazapa-grey-light);
    color:var(--pazapa-grey-dark);
    opacity:.6;
    cursor:not-allowed;
  }
  .btn-success{
    background:var(--pazapa-green);
    color:var(--pazapa-grey-dark);
  }
  .btn-success:disabled{
    background:var(--pazapa-grey-light);
    color:var(--pazapa-grey-dark);
    opacity:.6;
    cursor:not-allowed;
  }
  .btn-ghost{
    background:transparent;
    color:var(--pazapa-blue-dark);
    border:2px solid var(--pazapa-blue);
  }

  .carry-on-wrap{
    margin-top:.25rem;
  }

  /* instruction audio (speak) button */
  .instr-audio-btn{
    min-width:48px;
    min-height:48px;
    border-radius:50%;
    border:none;
    background:rgba(54,187,214,.15);
    color:var(--pazapa-blue-dark);
    display:inline-flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  .instr-audio-btn svg{width:22px; height:22px;}

  .instr-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:.6rem;
  }

  /* ---------- COMPLETION ---------- */
  .well-done-badge{
    width:110px;
    height:110px;
    border-radius:50%;
    background:var(--pazapa-green);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--pazapa-grey-dark);
  }
  .well-done-badge svg{width:56px; height:56px;}

  /* ---------- FOCUS ---------- */
  :focus-visible{
    outline:3px solid var(--pazapa-blue-dark);
    outline-offset:2px;
  }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width:420px){
    .word-grid{grid-template-columns:repeat(2, 1fr);}
    .character-slot{max-width:200px; min-height:120px;}
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="logo-slot" id="logoSlot">
      <!-- IMAGE_PAZAPA_LOGO: paste official logo <img> src here when supplied -->
      <span class="logo-fallback">Pazapa Phonics</span>
    </div>
    <div class="lesson-label">Week 1 · Lesson 1</div>
  </header>

  <main id="mainRegion">

    <!-- STEP 1 — MEET THE SOUND -->
    <section class="step active" id="step1" aria-labelledby="step1Heading">
      <div class="character-row">
        <div class="character-slot" id="leoSlot">
          <!-- IMAGE_LEO: official Leo artwork, Pazapa "Read With Leo & Fadi" Level 1 booklet cover -->
          <span class="placeholder-text">Leo</span>
        </div>
        <div class="character-slot" id="fadiSlot">
          <!-- IMAGE_FADI: paste official Fadi artwork here — source file received was corrupted, see note -->
          <span class="placeholder-text">Fadi</span>
        </div>
      </div>
      <h2 id="step1Heading" tabindex="-1">Meet Leo &amp; Fadi!</h2>

        <p class="instruction">Today we're discovering /s/.</p>
        <button class="instr-audio-btn" type="button" data-audio-key="intro" aria-label="Listen to the instruction">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>
        </button>
      </div>
      <div class="carry-on-wrap">
        <button class="btn btn-primary carry-on" type="button" data-next="step2">Carry on</button>
      </div>
    </section>

    <!-- Shared instruction audio channel (intro, listen, words_instruction, say_sound) -->
    <audio id="instrAudio" preload="none"></audio>

    <!-- STEP 2 — LISTEN TO /s/ -->
    <section class="step" id="step2" aria-labelledby="step2Heading">
      <div class="instr-row">
        <h2 id="step2Heading" tabindex="-1">Listen.</h2>
        <button class="instr-audio-btn" type="button" data-audio-key="listen" aria-label="Listen to the instruction">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>
        </button>
      </div>

      <button class="sound-btn" id="soundSBtn" type="button" aria-label="Play the sound /s/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a9 9 0 0 1 0 12"/></svg>
      </button>

      <button class="replay-btn" id="replaySBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
        Play it again
      </button>

      <audio id="soundSAudio" preload="none"></audio>

      <div class="carry-on-wrap">
        <button class="btn btn-primary carry-on" type="button" data-next="step3">Carry on</button>
      </div>
    </section>

    <!-- STEP 3 — LISTEN TO EXAMPLE WORDS -->
    <section class="step" id="step3" aria-labelledby="step3Heading">
      <div class="instr-row">
        <h2 id="step3Heading" tabindex="-1">Listen to these words.</h2>
        <button class="instr-audio-btn" type="button" data-audio-key="words_instruction" aria-label="Listen to the instruction">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>
        </button>
      </div>

      <div class="word-grid">
        <div class="word-card">
          <div class="img-frame">
            <!-- IMAGE_SNAKE: paste base64/source image src here when supplied -->
            <span class="placeholder-text">Snake</span>
          </div>
          <span class="word-label">Snake</span>
          <button class="speaker-btn" type="button" data-word="snake" aria-label="Play the word Snake">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>
          </button>
        </div>

        <div class="word-card">
          <div class="img-frame">
            <!-- IMAGE_SALAT: paste base64/source image src here when supplied -->
            <span class="placeholder-text">Salat</span>
          </div>
          <span class="word-label">Salat</span>
          <button class="speaker-btn" type="button" data-word="salat" aria-label="Play the word Salat">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>
          </button>
        </div>

        <div class="word-card">
          <div class="img-frame">
            <!-- IMAGE_SIT: paste base64/source image src here when supplied -->
            <span class="placeholder-text">Sit</span>
          </div>
          <span class="word-label">Sit</span>
          <button class="speaker-btn" type="button" data-word="sit" aria-label="Play the word Sit">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>
          </button>
        </div>

        <div class="word-card">
          <div class="img-frame">
            <!-- IMAGE_SUN: paste base64/source image src here when supplied -->
            <span class="placeholder-text">Sun</span>
          </div>
          <span class="word-label">Sun</span>
          <button class="speaker-btn" type="button" data-word="sun" aria-label="Play the word Sun">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>
          </button>
        </div>
      </div>

      <audio id="wordAudio" preload="none"></audio>

      <div class="carry-on-wrap">
        <button class="btn btn-primary carry-on" type="button" data-next="step4">Carry on</button>
      </div>
    </section>

    <!-- STEP 4 — SAY THE SOUND (optional) -->
    <section class="step" id="step4" aria-labelledby="step4Heading">
      <span class="optional-tag">Optional</span>
      <div class="instr-row">
        <h2 id="step4Heading" tabindex="-1">Can you say /s/?</h2>
        <button class="instr-audio-btn" type="button" data-audio-key="say_sound" aria-label="Listen to the instruction">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>
        </button>

      <div class="record-controls">

          <span id="recordBtnLabel">Record my voice</span>
        </button>

        <div class="playback-row" id="playbackRow" hidden>
          <audio class="playback-audio" id="playbackAudio" controls></audio>
          <button class="btn btn-ghost" id="reRecordBtn" type="button">Record again</button>
        </div>
      </div>

      <div class="carry-on-wrap">
        <button class="btn btn-primary carry-on" type="button" data-next="step5">Carry on</button>
      </div>
    </section>

    <!-- STEP 5 — COMPLETION -->
    <section class="step" id="step5" aria-labelledby="step5Heading">
      <div class="well-done-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </div>
      <h2 id="step5Heading" tabindex="-1">Well done!</h2>
      <p class="instruction">You discovered /s/!</p>

      <div class="carry-on-wrap">
        <button class="btn btn-success" id="doneBtn" type="button" disabled>Done</button>
      </div>
    </section>

  </main>
</div>

<script>
(function(){
  "use strict";

  /* ============ CONFIGURABLE ASSET SLOTS ============ */
  /* Each value can be an MP3 URL/path or a data:audio/mpeg;base64,... string.
     Leave empty ("") if the recording is not yet supplied — the matching
     button is then disabled rather than falling back to any synthetic voice. */
  var OFFICIAL_AUDIO = {
    intro: "",                 // "Today we're discovering a new sound."
    listen: "",                // "Listen."

  /* ============ APPLY IMAGE SLOTS ============ */
  function applyImage(imgWrapSelector, src, altText){
    var wrap = document.querySelector(imgWrapSelector);
    if(!wrap) return;
    if(src){
      wrap.innerHTML = "";
      var img = document.createElement("img");
      img.src = src;
      img.alt = altText;
      wrap.appendChild(img);
    }
    // if no src, the existing placeholder text stays as-is
  }
  applyImage("#logoSlot", IMAGES.logo, "Pazapa Phonics logo");
  if(IMAGES.logo){
    document.querySelector(".logo-fallback").remove();
  }
  applyImage("#leoSlot", IMAGES.leo, "Leo");
  applyImage("#fadiSlot", IMAGES.fadi, "Fadi");

  var wordFrames = document.querySelectorAll(".word-card .img-frame");
  var wordKeys = ["snake","salat","sit","sun"];
  wordFrames.forEach(function(frame, i){
    var key = wordKeys[i];
    if(IMAGES[key]){
      frame.innerHTML = "";
      var img = document.createElement("img");
      img.src = IMAGES[key];
      img.alt = key;
      frame.appendChild(img);
    }
  });

  /* ============ SINGLE AUDIO CHANNEL MANAGER ============ */
  var currentMediaEl = null;

  function stopAllMedia(exceptEl){
    // stop any playing <audio> elements — no speechSynthesis in this build
    document.querySelectorAll("audio").forEach(function(a){
      if(a !== exceptEl && !a.paused){
        a.pause();
      }
    });
    currentMediaEl = exceptEl || null;
  }

  /* ============ INSTRUCTION AUDIO (pre-recorded MP3 only) ============ */
  var instrAudio = document.getElementById("instrAudio");

  document.querySelectorAll(".instr-audio-btn").forEach(function(btn){
    var key = btn.getAttribute("data-audio-key");
    if(!OFFICIAL_AUDIO[key]){
      btn.disabled = true;
      console.warn("Official audio for instruction '" + key + "' not supplied. Button kept disabled — no synthetic voice fallback.");
    } else {
      btn.addEventListener("click", function(){
        stopAllMedia(instrAudio);
        instrAudio.src = OFFICIAL_AUDIO[key];
        instrAudio.currentTime = 0;
        instrAudio.play().catch(function(err){
          console.warn("Could not play instruction audio for '" + key + "'.", err);
        });
      });
    }
  });

  /* ============ STEP 2: ISOLATED /s/ SOUND ============ */
  var soundSBtn = document.getElementById("soundSBtn");
  var replaySBtn = document.getElementById("replaySBtn");
  var soundSAudio = document.getElementById("soundSAudio");

  if(OFFICIAL_AUDIO.sound_s){
    soundSAudio.src = OFFICIAL_AUDIO.sound_s;
    soundSBtn.disabled = false;
    replaySBtn.disabled = false;
  } else {
    soundSBtn.disabled = true;
    replaySBtn.disabled = true;
    console.warn("Official /s/ audio not supplied. Sound button kept disabled. TTS is never used for the isolated phoneme.");
  }

  function playSoundS(){
    if(!OFFICIAL_AUDIO.sound_s) return;
    stopAllMedia(soundSAudio);
    soundSAudio.currentTime = 0;
    soundSAudio.play().catch(function(err){
      console.warn("Could not play /s/ audio.", err);
    });
  }
  soundSBtn.addEventListener("click", playSoundS);
  replaySBtn.addEventListener("click", playSoundS);

  /* ============ STEP 3: WORD CARDS ============ */
  var wordAudio = document.getElementById("wordAudio");
  document.querySelectorAll(".speaker-btn").forEach(function(btn){
    var key = btn.getAttribute("data-word");
    if(!OFFICIAL_AUDIO[key]){
      btn.disabled = true;
      console.warn("Official audio for '" + key + "' not supplied. Speaker button kept disabled. TTS is never used for model vocabulary.");
    } else {
      btn.addEventListener("click", function(){
        stopAllMedia(wordAudio);
        wordAudio.src = OFFICIAL_AUDIO[key];
        wordAudio.currentTime = 0;
        wordAudio.play().catch(function(err){
          console.warn("Could not play word audio for " + key + ".", err);
        });
      });
    }
  });

  /* ============ STEP 4: OPTIONAL VOICE RECORDING ============ */
  var recordBtn = document.getElementById("recordBtn");
  var recordBtnLabel = document.getElementById("recordBtnLabel");
  var playbackRow = document.getElementById("playbackRow");
  var playbackAudio = document.getElementById("playbackAudio");
  var reRecordBtn = document.getElementById("reRecordBtn");

  var mediaRecorder = null;
  var recordedChunks = [];
  var isRecording = false;
  var currentStream = null;

  function resetRecordingUI(){
    playbackRow.hidden = true;
    playbackAudio.removeAttribute("src");
    recordBtn.hidden = false;
    recordBtn.classList.remove("recording");
    recordBtnLabel.textContent = "Record my voice";
  }

  function startRecording(){
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === "undefined"){
      console.warn("MediaRecorder is not supported in this browser.");
      return;
    }
    navigator.mediaDevices.getUserMedia({ audio: true })
      .then(function(stream){
        currentStream = stream;
        recordedChunks = [];
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = function(e){
          if(e.data && e.data.size > 0) recordedChunks.push(e.data);
        };
        mediaRecorder.onstop = function(){
          var blob = new Blob(recordedChunks, { type: "audio/webm" });
          var url = URL.createObjectURL(blob);
          stopAllMedia(playbackAudio);
          playbackAudio.src = url;
          playbackRow.hidden = false;
          recordBtn.hidden = true;
          if(currentStream){
            currentStream.getTracks().forEach(function(t){ t.stop(); });
            currentStream = null;
          }
        };
        stopAllMedia(null);
        mediaRecorder.start();
        isRecording = true;
        recordBtn.classList.add("recording");
        recordBtnLabel.textContent = "Stop recording";
      })
      .catch(function(err){
        console.warn("Microphone permission denied or unavailable.", err);
      });
  }

  function stopRecording(){
    if(mediaRecorder && isRecording){
      mediaRecorder.stop();
      isRecording = false;
    }
  }

  recordBtn.addEventListener("click", function(){
    if(!isRecording){
      startRecording();
    } else {
      stopRecording();
    }
  });

  reRecordBtn.addEventListener("click", function(){
    resetRecordingUI();
  });

  /* ============ STEP NAVIGATION ============ */
  var steps = ["step1","step2","step3","step4","step5"];

  function showStep(targetId){
    stopAllMedia(null);
    steps.forEach(function(id){
      var el = document.getElementById(id);
      el.classList.toggle("active", id === targetId);
    });
    var heading = document.querySelector("#" + targetId + " h2");
    if(heading){
      heading.setAttribute("tabindex", "-1");
      heading.focus();
    }
    if(targetId === "step5"){
      doneBtn.disabled = false;
    }
  }

  document.querySelectorAll(".carry-on").forEach(function(btn){
    btn.addEventListener("click", function(){
      showStep(btn.getAttribute("data-next"));
    });
  });

  /* ============ COMPLETION LOGIC ============ */
  var doneBtn = document.getElementById("doneBtn");
  doneBtn.disabled = true;

  var completionSent = false;
  function activityCompleted(){
    if(completionSent) return;
    completionSent = true;
    console.log("W1L1 Let's Discover the Sound completed");
  }

  doneBtn.addEventListener("click", function(){
    activityCompleted();
  });

})();
</script>
