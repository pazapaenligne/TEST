*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);color:var(--ink);background:radial-gradient(ellipse at 50% 30%,var(--table1),var(--table2) 85%);overflow:hidden;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;background:repeating-linear-gradient(92deg,rgba(255,255,255,.06) 0 2px,transparent 2px 9px,rgba(0,0,0,.08) 9px 11px,transparent 11px 23px)}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--bleu);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{position:relative;display:flex;flex-direction:column;height:100vh;height:100dvh}

#bar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:6px 12px;background:rgba(255,255,255,.92);box-shadow:0 2px 10px rgba(0,0,0,.35);z-index:50;flex-wrap:wrap}
:root[data-theme="dark"] #bar{background:rgba(30,34,38,.95)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) #bar{background:rgba(30,34,38,.95)}}
#bar img{height:28px;width:auto}
#bar .ttl{font-family:var(--serif);font-weight:bold;font-size:1.05rem;color:var(--cb);margin-right:auto}
:root[data-theme="dark"] #bar .ttl{color:#7cc0ff}
.tb{min-width:44px;min-height:44px;border:2px solid var(--bleu);background:var(--bleu-c);color:var(--ink);border-radius:18px;font-weight:bold;font-size:.85rem;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.tb[aria-pressed="true"]{background:var(--jaune);border-color:var(--ombre-j);color:#2E2E2D}

#stage{position:relative;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;perspective:2400px;padding:10px 8px 4px}

function bounceLab(){
  const u=U('m2',{r:3});
  const root=h('div',{class:'model'});
  const cv=h('canvas',{class:'cv',width:420,height:190,role:'img','aria-label':'Balle qui rebondit, chaque rebond atteint les trois quarts de la hauteur précédente'});
  const info=h('div',{class:'expl',style:{marginTop:'.3em'}});
  const ctx=cv.getContext('2d');
  const GY=165,SC=130,X0=34,W=56;
  const cs=()=>getComputedStyle(document.documentElement);
  function apex(k){return Math.pow(.75,k)}
  const xa=k=>k===0?X0:X0+W*(k-.5);
  function draw(ball){
    ctx.clearRect(0,0,420,190);
    const ink=cs().getPropertyValue('--ink').trim()||'#222';
    ctx.strokeStyle=ink;ctx.fillStyle=ink;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(10,GY+10);ctx.lineTo(410,GY+10);ctx.stroke();
    ctx.font='11px Arial';
    for(let k=0;k<=6;k++){
      const y=GY-apex(k)*SC,xc=xa(k),on=k===u.r;
      ctx.setLineDash([3,3]);ctx.strokeStyle=on?'#C2307A':'#8aa';ctx.lineWidth=on?2:1;ctx.beginPath();ctx.moveTo(xc-16,y);ctx.lineTo(xc+16,y);ctx.stroke();ctx.setLineDash([]);
      ctx.fillStyle=on?'#C2307A':ink;ctx.fillText(k===0?'départ 1 m':'rebond '+k,xc-20,y-4);
    }
    ctx.setLineDash([2,3]);ctx.strokeStyle='#E8561E';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(X0,GY-SC);ctx.lineTo(X0,GY);
    for(let k=1;k<=u.r;k++){const x1=X0+W*(k-1),x2=X0+W*k,hh=apex(k)*SC;ctx.moveTo(x1,GY);ctx.quadraticCurveTo((x1+x2)/2,GY-2*hh,x2,GY)}
    ctx.stroke();ctx.setLineDash([]);
    if(ball){ctx.fillStyle='#E8561E';ctx.beginPath();ctx.arc(ball.x,ball.y,9,0,7);ctx.fill();ctx.fillStyle='rgba(255,255,255,.55)';ctx.beginPath();ctx.arc(ball.x-3,ball.y-3,3,0,7);ctx.fill()}
  }
  function pos(t){
    const T=.55;let tt=t;
    if(tt<=T){const p=tt/T;return{x:X0,y:GY-(1-p*p)*SC,done:false}}
    tt-=T;
    for(let k=1;k<=u.r;k++){const d=2*T*Math.sqrt(apex(k));if(tt<=d){const p=tt/d;return{x:X0+W*(k-1)+W*p,y:GY-4*apex(k)*p*(1-p)*SC,done:false}}tt-=d}
    return{x:X0+W*u.r,y:GY,done:true};
  }
  let raf=0;
  function play(){cancelAnimationFrame(raf);if(reduce()){draw(pos(999));return}const t0=performance.now();const f=now=>{if(!root.isConnected)return;const t=(now-t0)/1000*1.1;const b=pos(t);draw(b);if(!b.done)raf=requestAnimationFrame(f);else{draw(b)}};raf=requestAnimationFrame(f)}
  function upd(){
    const v=q(3,4).pow(u.r);
    info.innerHTML=m(`Après le rebond n°${u.r} : h = 1 × ({3//4})^${u.r} = {${3**u.r}//${4**u.r}} m ≈ ${roundDec(v,3)} m`);
    draw(null);
  }
  const sl=slider('s-m2','Numéro du rebond',1,6,u.r,v=>{u.r=v;upd()});
  const tbl=h('div',{class:'row',style:{fontSize:'.85em'}});
  root.append(sl,cv,h('div',{class:'row'},h('button',{class:'btn pri sm',type:'button',onclick:play},'▶ Lâcher la balle')),info);
  upd();return root;
}

function fit(){
  const st=$('#stage'),vt=$('#vt');

  /* la taille choisie par l'élève n'est jamais réduite pour « faire tenir » : on change plutôt de disposition */
  function geom(){

    const dbw=Math.min(W,H*1.42,S.zoom?2100:1400);
    const dfs=Math.max(13.5,Math.min(21,dbw/64))*(S.zoom?1.18:1)*sc;
    const autoSingle=window.innerWidth<980||W<760||dbw<780||(dbw/2)/dfs<29;
    const single=PF.view==='one'?true:PF.view==='two'?false:autoSingle;
    let bw,bh,fs,narrow=false;
    if(single){bw=Math.min(W,640*Math.max(1,sc)*(S.zoom?1.3:1));bh=H;fs=Math.max(13.5,Math.min(18,Math.min(W,640)/25))*(S.zoom?1.18:1)*sc}
    else if(autoSingle){/* deux pages demandées dans un espace étroit : on occupe toute la largeur et la hauteur disponibles */
      bw=Math.min(W,S.zoom?2100:1400);bh=Math.min(H,bw/.4);fs=dfs;narrow=(bw/2)/fs<22}
    else{bw=dbw;bh=bw/1.42;fs=dfs}
    return{single,bw,bh,fs,narrow};
  }
  let g=geom();
  const want=g.narrow&&!S.vtHide;
  if(vt&&vt.classList.contains('on')!==want){vt.classList.toggle('on',want);g=geom()}
  S.single=g.single;
  {const vm=$('#vt-msg');if(vm)vm.textContent=PF.size>=150?'Avec le texte agrandi, deux pages étroites sont difficiles à lire. Choisis une seule page, ou tourne le téléphone en paysage.':'Les deux pages sont étroites. Tourne le téléphone en paysage, ou choisis une seule page.'}
  bookEl.style.setProperty('--bw',Math.round(g.bw)+'px');bookEl.style.setProperty('--bh',Math.round(g.bh)+'px');bookEl.style.setProperty('--fs',g.fs.toFixed(2)+'px');
  bookEl.classList.toggle('single',S.single);
  document.body.classList.toggle('flat',S.single);
  if(wasSingle!==S.single){if(S.single)S.page=S.spread*2;else S.spread=S.page>>1;mount()}
  syncView&&syncView();
}
function updateNav(){
  const last=S.single?NSP*2-1:NSP-1,cur=S.single?S.page:S.spread;
  navEls.prev.disabled=cur<=0;navEls.next.disabled=cur>=last;
  navEls.info.textContent=S.single?`Page ${S.page+1} / ${NSP*2}`:`Pages ${S.spread*2+1}–${S.spread*2+2} / ${NSP*2}`;
  const ch=SP[S.spread].ch;

/* feuille qui tourne : deux bandes pour simuler la courbure du papier */
function makeLeaf(front,back,pw,H,left){
  const half=pw/2;
  const leaf=h('div',{class:'leaf',style:{left:left+'px',width:pw+'px',transformOrigin:'0 50%'}});
  const s1=h('div',{class:'strip',style:{left:'0',width:half+'px',transformOrigin:'0 50%'}});
  const s2=h('div',{class:'strip',style:{left:half+'px',width:half+'px',transformOrigin:'0 50%'}});
  const shades=[];
  const mk=(node,off,bk)=>{
    const f=h('div',{class:'face'+(bk?' bk':'')});
    const c=node.cloneNode(true);c.classList.add('clone');c.style.cssText=`position:absolute;top:0;height:${H}px;width:${pw}px;left:${off}px;`;
    const sh=h('div',{class:'shade'});shades.push(sh);f.append(c,sh);return f;
  };
  s1.append(mk(front,0,false),mk(back,-half,true));
  s2.append(mk(front,-half,false),mk(back,0,true));
  s1.append(s2);leaf.append(s1);
  return{el:leaf,set(a){const t=Math.abs(a)/180;leaf.style.transform=`translateZ(1px) rotateY(${a}deg)`;s2.style.transform=`rotateY(${(18*Math.sin(Math.PI*t)).toFixed(2)}deg)`;const o=(.6*Math.sin(Math.PI*t)).toFixed(3);shades.forEach(x=>x.style.opacity=o)}};
}
async function flipSpread(dir){
  if(S.busy)return;S.busy=true;sfx.flip();
  const pw=bookEl.clientWidth/2,H=bookEl.clientHeight;
  const cur=S.spread,nxt=cur+dir;
  const uL=$('.under',Lw),uR=$('.under',Rw);
  let leaf;
  try{
    if(dir>0){
      const front=build(cur,'R'),back=build(nxt,'L');
      setPage(Rw,build(nxt,'R'));
      leaf=makeLeaf(front,back,pw,H,pw);bookEl.append(leaf.el);leaf.set(0);
      await run(950,p=>{const e=ease(p);leaf.set(-180*e);uR.style.opacity=(.55*(1-e)).toFixed(3);uL.style.opacity=(.5*e).toFixed(3)});
      setPage(Lw,build(nxt,'L'));
    }else{
      const front=build(nxt,'R'),back=build(cur,'L');
      setPage(Lw,build(nxt,'L'));
      leaf=makeLeaf(front,back,pw,H,pw);bookEl.append(leaf.el);leaf.set(-180);
      await run(950,p=>{const e=ease(p);leaf.set(-180*(1-e));uR.style.opacity=(.55*e).toFixed(3);uL.style.opacity=(.5*(1-e)).toFixed(3)});
      setPage(Rw,build(nxt,'R'));
    }
  }finally{
    if(leaf)leaf.el.remove();uL.style.opacity=0;uR.style.opacity=0;
    S.spread=nxt;updateNav();idle();
  }
}
async function flipSingle(dir){
  if(S.busy)return;S.busy=true;sfx.flip();
  const pw=bookEl.clientWidth,H=bookEl.clientHeight;
  const cur=S.page,nxt=cur+dir;const fc=flatInfo(cur),fn=flatInfo(nxt);
  let leaf;
  try{
    if(dir>0){
      const front=build(fc.i,fc.side);setPage(Rw,build(fn.i,fn.side));
      leaf=makeLeaf(front,h('section',{class:'pg R'}),pw,H,0);bookEl.append(leaf.el);leaf.set(0);
      await run(700,p=>{const e=ease(p);leaf.set(-115*e);leaf.el.style.opacity=p>.7?String(1-(p-.7)/.3):'1'});
    }else{
      const front=build(fn.i,fn.side);
      leaf=makeLeaf(front,h('section',{class:'pg R'}),pw,H,0);bookEl.append(leaf.el);leaf.set(-115);
      await run(700,p=>{const e=ease(p);leaf.set(-115*(1-e));leaf.el.style.opacity=p<.3?String(p/.3):'1'});
      setPage(Rw,build(fn.i,fn.side));
    }
  }finally{
    if(leaf)leaf.el.remove();
    S.page=nxt;S.spread=nxt>>1;updateNav();idle();
  }
}
async function fadeTo(fn){
  if(S.busy)return;S.busy=true;
  bookEl.style.transition='opacity .18s';bookEl.style.opacity='0';
  await new Promise(r=>setTimeout(r,reduce()?0:190));
  fn();bookEl.style.opacity='1';
  await new Promise(r=>setTimeout(r,reduce()?0:190));
  bookEl.style.transition='';idle();
}
function go(i,force){
  i=Math.max(0,Math.min(NSP-1,i));
  if(S.busy){S.pendingGo=[i,force];return}
  if(S.single){const p=i*2;if(p===S.page&&!force)return;fadeTo(()=>{S.page=p;S.spread=i;mount();$('.pb',Rw)&&($('.pb',Rw).scrollTop=0)});return}
  if(i===S.spread&&!force)return;
  if(!force&&Math.abs(i-S.spread)===1)flipSpread(i-S.spread);
  else fadeTo(()=>{S.spread=i;mount()});
}
function next(){if(S.single){if(S.page<NSP*2-1)flipSingle(1)}else if(S.spread<NSP-1)flipSpread(1)}
function prev(){if(S.single){if(S.page>0)flipSingle(-1)}else if(S.spread>0)flipSpread(-1)}

function bindInput(){
  const hscroll=el=>{for(let x=el;x&&x!==document.body;x=x.parentElement){if(x.scrollWidth>x.clientWidth+2&&/(auto|scroll)/.test(getComputedStyle(x).overflowX))return true}return false};
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){const op=['cp','tp'].find(x=>document.getElementById(x).classList.contains('on'));if(op){openPanel(op,false);const b=document.querySelector('[aria-controls="'+op+'"]');b&&b.focus();return}}
    const t=e.target;if(t&&(t.tagName==='INPUT'||t.tagName==='SELECT'||t.tagName==='TEXTAREA'||t.isContentEditable))return;
    if(e.defaultPrevented||e.isComposing||e.altKey||e.ctrlKey||e.metaKey||e.shiftKey)return;
    const fw=e.key==='ArrowRight'||e.key==='PageDown',bw=e.key==='ArrowLeft'||e.key==='PageUp';
    if(!fw&&!bw)return;
    if(t&&t.closest&&t.closest('#cp,#tp'))return;
    if(t&&t.nodeType===1&&(e.key==='ArrowRight'||e.key==='ArrowLeft')&&hscroll(t))return;
    if(e.key==='PageDown'||e.key==='PageUp'){const pb=document.querySelector('.pg:not(.clone) .pb');if(pb&&pb.scrollHeight>pb.clientHeight+2){const d=fw?1:-1,atEnd=fw?pb.scrollTop+pb.clientHeight>=pb.scrollHeight-2:pb.scrollTop<=1;if(!atEnd){e.preventDefault();pb.scrollBy({top:d*pb.clientHeight*.9,behavior:reduce()?'auto':'smooth'});return}}}
    e.preventDefault();if(fw)next();else prev();
  });
  let sx=0,sy=0,st=0,ok=false;
  const stage=$('#stage');
  stage.addEventListener('pointerdown',e=>{ok=!e.target.closest('input,button,select,textarea,canvas,a,[data-noswipe],.flap')&&!hscroll(e.target);sx=e.clientX;sy=e.clientY;st=performance.now()});
  stage.addEventListener('pointerup',e=>{
    if(!ok)return;const dx=e.clientX-sx,dy=e.clientY-sy;
    if(Math.abs(dx)>60&&Math.abs(dx)>1.6*Math.abs(dy)&&performance.now()-st<900){if(dx<0)next();else prev()}
  });
  let rt=0;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(S.busy)S.refit=true;else fit()},120)});
}

}
