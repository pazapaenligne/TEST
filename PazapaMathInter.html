<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pazapa · Puissances d'un nombre · 3e</title>
<style>
:root{
  --bleu:#36BBD6;--bleu-c:#E4F7FB;--vert:#C9D646;--vert-c:#F3F7DD;--jaune:#FCC104;--jaune-c:#FFF3D6;--rouge:#E6352B;
  --gris:#2E2E2D;--gris-c:#EBEBEB;--ombre-j:#d9a403;
  --cb:#0A6FC2;--cj:#FFC000;--cv:#9B72B8;--co:#E8561E;
  --paper:#fffdf7;--paper2:#f6efdf;--ink:#2E2E2D;--ink2:#5d6b6e;--line:#e3dac3;
  --k-base:#1F77C8;--k-exp:#C2307A;--k-prod:#4E9A24;--k-quot:#E8830C;--k-pp:#7E4FB1;--k-same:#0E93A6;--k-ten:#C99200;--k-sci:#D9482B;
  --ok:#E3F1C4;--ok-b:#7DA72A;--soft:#FFF0CC;--soft-b:#E0A100;--info:#E4F7FB;--info-b:#36BBD6;
  --table1:#5b3d26;--table2:#3f2917;
  --sans:Arial,Helvetica,sans-serif;--serif:"Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
  --z:1;
}
:root[data-theme="dark"]{
  --paper:#2a2d31;--paper2:#33373c;--ink:#ecebe6;--ink2:#b5bec1;--line:#4a4f55;
  --ok:#31401c;--ok-b:#8fbd3a;--soft:#4a3d17;--soft-b:#e0a100;--info:#183b45;--info-b:#36BBD6;
  --table1:#20262b;--table2:#12161a;--gris-c:#3a3f45;--bleu-c:#183b45;--jaune-c:#4a3d17;--vert-c:#2f3a1b;
  --k-base:#5aaaf0;--k-exp:#f06aa9;--k-prod:#86cf4a;--k-quot:#ffa43a;--k-pp:#b48bea;--k-same:#3dc6d8;--k-ten:#f0c040;--k-sci:#ff7a5c;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#2a2d31;--paper2:#33373c;--ink:#ecebe6;--ink2:#b5bec1;--line:#4a4f55;
  --ok:#31401c;--ok-b:#8fbd3a;--soft:#4a3d17;--soft-b:#e0a100;--info:#183b45;--info-b:#36BBD6;
  --table1:#20262b;--table2:#12161a;--gris-c:#3a3f45;--bleu-c:#183b45;--jaune-c:#4a3d17;--vert-c:#2f3a1b;
  --k-base:#5aaaf0;--k-exp:#f06aa9;--k-prod:#86cf4a;--k-quot:#ffa43a;--k-pp:#b48bea;--k-same:#3dc6d8;--k-ten:#f0c040;--k-sci:#ff7a5c;}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);color:var(--ink);background:radial-gradient(ellipse at 50% 30%,var(--table1),var(--table2) 85%);overflow:hidden;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;background:repeating-linear-gradient(92deg,rgba(255,255,255,.06) 0 2px,transparent 2px 9px,rgba(0,0,0,.08) 9px 11px,transparent 11px 23px)}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--bleu);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{position:relative;display:flex;flex-direction:column;height:100vh;height:100dvh}
/* barre du haut */
#bar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:6px 12px;background:rgba(255,255,255,.92);box-shadow:0 2px 10px rgba(0,0,0,.35);z-index:50;flex-wrap:wrap}
:root[data-theme="dark"] #bar{background:rgba(30,34,38,.95)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) #bar{background:rgba(30,34,38,.95)}}
#bar img{height:28px;width:auto}
#bar .ttl{font-family:var(--serif);font-weight:bold;font-size:1.05rem;color:var(--cb);margin-right:auto}
:root[data-theme="dark"] #bar .ttl{color:#7cc0ff}
.tb{min-width:44px;min-height:44px;border:2px solid var(--bleu);background:var(--bleu-c);color:var(--ink);border-radius:18px;font-weight:bold;font-size:.85rem;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.tb[aria-pressed="true"]{background:var(--jaune);border-color:var(--ombre-j);color:#2E2E2D}
/* scène */
#stage{position:relative;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;perspective:2400px;padding:10px 8px 4px}
#book{position:relative;width:var(--bw,900px);height:var(--bh,600px);font-size:var(--fs,15px);transform-style:preserve-3d;transform:rotateX(7deg);transform-origin:50% 100%;transition:transform .5s}
body.zoom #book,body.flat #book{transform:none}
#book .shadow{position:absolute;left:2%;right:2%;bottom:-14px;height:26px;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,.55),transparent 70%);filter:blur(6px);pointer-events:none}
.pgwrap{position:absolute;top:0;height:100%;width:50%;}
.pgwrap.l{left:0}.pgwrap.r{left:50%}
.single .pgwrap{width:100%;left:0}
.single .pgwrap.l{display:none}
.pg{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--paper);overflow:hidden;color:var(--ink)}
.pg::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;opacity:.5;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .45  0 0 0 0 .3  0 0 0 .09 0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
.pg>*{position:relative;z-index:1}
.pg.L{border-radius:10px 0 0 10px;box-shadow:-1px 0 0 var(--line),-2px 1px 0 #efe7d3,-3px 2px 0 var(--line),-4px 3px 0 #efe7d3,-5px 4px 0 var(--line),-6px 5px 0 #efe7d3,-7px 6px 0 var(--line),0 8px 14px rgba(0,0,0,.4)}
.pg.R{border-radius:0 10px 10px 0;box-shadow:1px 0 0 var(--line),2px 1px 0 #efe7d3,3px 2px 0 var(--line),4px 3px 0 #efe7d3,5px 4px 0 var(--line),6px 5px 0 #efe7d3,7px 6px 0 var(--line),0 8px 14px rgba(0,0,0,.4)}
.single .pg{border-radius:10px}
.pg.L::after,.pg.R::after{content:"";position:absolute;top:0;bottom:0;width:9%;pointer-events:none;z-index:5}
.pg.L::after{right:0;background:linear-gradient(to left,rgba(0,0,0,.22),transparent)}
.pg.R::after{left:0;background:linear-gradient(to right,rgba(0,0,0,.22),transparent)}
.single .pg::after{width:3%;opacity:.5}
.spine{position:absolute;left:calc(50% - 1px);top:0;bottom:0;width:2px;background:rgba(0,0,0,.35);z-index:3;pointer-events:none}
.single .spine{display:none}
/* en-tête de page style cahier */
.ph{flex:0 0 auto;display:flex;align-items:center;gap:.8em;min-height:3.2em;padding:.5em .9em .5em 1em;color:#fff;background:var(--cb);border-radius:0 0 3.2em 0;margin-right:22%}
.pg.R .ph{border-radius:0 0 0 3.2em;margin-right:0;margin-left:22%;flex-direction:row-reverse;text-align:right}
.single .pg .ph{margin-left:0;margin-right:0;border-radius:0 0 3.2em 0;flex-direction:row;text-align:left}
.ph-label{font-family:var(--serif);font-weight:bold;font-size:1.45em;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.ph-title{font-size:.82em;font-weight:bold;opacity:.95;line-height:1.2}
.ph.c0{background:#0A6FC2}.ph.c1{background:#0A6FC2}.ph.c2{background:#2D8A2A}.ph.c3{background:#B27A00}.ph.c4{background:#C23B1E}.ph.c5{background:#6D4A96}
.pb{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding:.6em 1em 1.7em;-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 1.2em),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 1.2em),transparent);scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.pf{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:.2em 1em .45em}
.pg.R .pf{flex-direction:row-reverse}
.pno{font-size:.78em;color:var(--ink2)}
.plogo{height:1.25em;width:auto;opacity:.95}
/* typographie page */
.pb h3{font-family:var(--serif);font-size:1.28em;margin:.2em 0 .4em;color:var(--cb);line-height:1.2}
:root[data-theme="dark"] .pb h3{color:#7cc0ff}
.pb p{margin:.35em 0;line-height:1.45}
.pb ul{margin:.3em 0;padding-left:1.2em}
.pb li{margin:.15em 0}
.sec{margin:.55em 0 .8em;position:relative}
.tag{display:inline-block;font-weight:bold;font-size:.78em;letter-spacing:.04em;text-transform:uppercase;color:#fff;background:var(--tc,var(--cb));padding:.18em .75em;border-radius:1em;margin-bottom:.35em}
.tag.dec{--tc:#1587C9}.tag.exp{--tc:#4E9A24}.tag.cmp{--tc:#7E4FB1}.tag.ent{--tc:#E8561E}.tag.def{--tc:#C23B1E}.tag.ret{--tc:#C99200;color:#2E2E2D}
.box{border-radius:14px;padding:.55em .8em;margin:.45em 0;border:2px solid var(--line);background:var(--paper2)}
.box .bt{font-weight:bold;text-decoration:underline;color:var(--co);margin-right:.35em}
.box.def .bt{color:#D8381B}.box.prop .bt{color:#D8381B}.box.ex .bt{color:var(--co)}
.box.ret{background:var(--jaune-c);border:3px solid var(--cj);border-radius:18px}
:root[data-theme="dark"] .box.ret{background:#4a3d17}
.note{background:#FFEE8F;color:#3b3200;border-radius:4px 4px 14px 4px;padding:.5em .7em;margin:.55em 0 .55em 8%;transform:rotate(-.9deg);box-shadow:2px 4px 7px rgba(0,0,0,.25);font-size:.92em;position:relative}
.note::before{content:"";position:absolute;top:-.5em;left:50%;width:2.4em;height:.9em;margin-left:-1.2em;background:rgba(255,255,255,.55);transform:rotate(2deg);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.note b{color:#8a2a00}
.dm{background:rgba(155,114,184,.12);border:2px solid var(--cv);border-radius:14px;padding:.5em .8em}
/* maths */
sup{font-size:.68em;line-height:0;vertical-align:.72em;font-weight:bold}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .15em;line-height:1.15}
.fr .nu{border-bottom:.09em solid currentColor;padding:0 .2em .05em}
.fr .de{padding:.05em .2em 0}
.bs{color:var(--k-base);font-weight:bold}.ex{ }
.xp{color:var(--k-exp);font-weight:bold}
.k-prod{color:var(--k-prod);font-weight:bold}.k-quot{color:var(--k-quot);font-weight:bold}.k-pp{color:var(--k-pp);font-weight:bold}.k-same{color:var(--k-same);font-weight:bold}.k-ten{color:var(--k-ten);font-weight:bold}.k-sci{color:var(--k-sci);font-weight:bold}
.mth{font-size:1.1em;white-space:nowrap}
.big{font-size:1.5em}
.nw{white-space:nowrap}
/* boutons */
.btn{min-height:40px;border:2px solid var(--bleu);background:var(--bleu-c);color:var(--ink);border-radius:18px;font-weight:bold;font-size:.9em;padding:.3em .95em;transition:transform .1s}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--jaune);border-color:var(--jaune);color:#2E2E2D;box-shadow:0 3px 0 var(--ombre-j)}
.btn.pri:active{box-shadow:0 1px 0 var(--ombre-j);transform:translateY(2px)}
.btn.sm{min-height:34px;font-size:.8em;padding:.15em .7em}
.btn[disabled]{opacity:.5;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:.35em;margin:.3em 0}
.chip{min-height:36px;min-width:36px;border:2px solid var(--bleu);background:var(--paper);color:var(--ink);border-radius:18px;font-weight:bold;padding:.1em .75em;font-size:.9em}
.chip[aria-pressed="true"]{background:var(--bleu);color:#fff;border-color:var(--bleu)}
.tabs{display:flex;gap:.3em;margin:.3em 0 .5em;flex-wrap:wrap}
.tabs .chip{border-radius:14px 14px 4px 4px;border-color:var(--k-base)}
.tabs .chip[aria-pressed="true"]{background:var(--k-base)}
input.fld,select.fld{font:inherit;font-weight:bold;color:var(--ink);background:var(--paper);border:2px solid var(--bleu);border-radius:10px;padding:.15em .3em;min-height:36px;text-align:center;width:4.4em}
input.fld.w2{width:3em}input.fld.w6{width:7.2em}input.fld.w8{width:9.5em}
select.fld{width:auto;max-width:100%;text-align:left}
input.fld.good,select.fld.good{border-color:var(--ok-b);background:var(--ok)}
input.fld.soft{border-color:var(--soft-b);background:var(--soft)}
input.fld:disabled,select.fld:disabled{opacity:1}
input[type=range]{width:100%;min-height:32px;accent-color:var(--bleu)}
label.lb{font-weight:bold;font-size:.9em}
/* exercices */
.ex-h{display:flex;align-items:center;gap:.5em;margin:.5em 0 .2em;flex-wrap:wrap}
.ex-h b{font-size:1em;color:var(--co);text-decoration:underline}
.ex-h .dots{margin-left:auto;display:flex;gap:3px}
.dot{width:.7em;height:.7em;border-radius:50%;background:var(--gris-c);border:1px solid var(--line)}
.dot.on{background:var(--ok-b);border-color:var(--ok-b)}.dot.half{background:var(--soft-b);border-color:var(--soft-b)}
.item{border-left:5px solid var(--bleu);background:var(--paper2);border-radius:0 12px 12px 0;padding:.4em .6em;margin:.35em 0}
.item.done{border-left-color:var(--ok-b)}
.item .q{display:flex;flex-wrap:wrap;align-items:center;gap:.35em;line-height:1.7}
.item .acts{display:flex;flex-wrap:wrap;gap:.3em;margin-top:.3em;align-items:center}
.fb{margin:.35em 0 0;padding:.4em .6em;border-radius:10px;font-size:.92em;line-height:1.4;border:2px solid var(--info-b);background:var(--info)}
.fb.ok{background:var(--ok);border-color:var(--ok-b)}.fb.soft{background:var(--soft);border-color:var(--soft-b)}
.help{margin:.3em 0 0;padding:.35em .6em;border-radius:10px;font-size:.9em;border:2px dashed var(--bleu);background:var(--paper)}
.help b{color:var(--cb)}
.opts{display:flex;flex-wrap:wrap;gap:.35em}
.opt{min-height:40px;border:2px solid var(--bleu);background:var(--paper);color:var(--ink);border-radius:14px;padding:.2em .7em;font-weight:bold}
.opt[aria-pressed="true"]{background:var(--bleu);color:#fff}
.opt.good{background:var(--ok);border-color:var(--ok-b);color:var(--ink)}
.opt.try{background:var(--soft);border-color:var(--soft-b);color:var(--ink)}
/* rabat de prédiction */
.pred{border:2px dashed var(--cv);border-radius:14px;padding:.5em .7em;margin:.4em 0;background:rgba(155,114,184,.08)}
.pred .pt{font-weight:bold;color:var(--cv)}
:root[data-theme="dark"] .pred .pt{color:#c8a5ee}
.flap{position:relative;margin-top:.45em;perspective:700px;min-height:3.2em}
.flap-body{padding:.45em .65em;border-radius:10px;background:var(--paper);border:2px solid var(--cv);font-size:.92em;line-height:1.4}
.flap-cover{position:absolute;inset:0;transform-origin:50% 0;transition:transform .9s cubic-bezier(.3,.7,.2,1);backface-visibility:visible;border-radius:10px;background:linear-gradient(180deg,#f1e4c6,#e6d4a8);color:#4a3a15;display:flex;align-items:center;justify-content:center;font-weight:bold;box-shadow:0 5px 10px rgba(0,0,0,.3);border:0;font-size:.9em;text-align:center;padding:.2em}
.flap-cover[disabled]{opacity:.7}
.flap.open .flap-cover{transform:rotateX(-172deg);pointer-events:none;opacity:0;transition:transform .9s cubic-bezier(.3,.7,.2,1),opacity .2s .8s}
/* modèles émergents */
.model{border-radius:16px;padding:.6em .7em;margin:.5em 0;background:var(--paper);border:2px solid var(--line);box-shadow:0 12px 18px -10px rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.7) inset;animation:popup .6s cubic-bezier(.2,.9,.3,1.15) both;transform-origin:50% 100%}
@keyframes popup{0%{transform:perspective(600px) rotateX(78deg) scale(.94);opacity:0}55%{opacity:1}100%{transform:perspective(600px) rotateX(0) scale(1);opacity:1}}
.blocks{display:flex;flex-wrap:wrap;gap:.25em;align-items:center;margin:.25em 0}
.blk{min-width:2em;height:2em;padding:0 .3em;border-radius:.5em;background:var(--bc,var(--k-base));color:#fff;font-weight:bold;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 .25em 0 rgba(0,0,0,.25),0 .5em .6em -.2em rgba(0,0,0,.4);animation:blkin .45s cubic-bezier(.2,.9,.3,1.3) both;animation-delay:calc(var(--i,0)*60ms)}
.blk.c2{--bc:var(--k-quot)}.blk.c3{--bc:var(--k-same)}.blk.c4{--bc:var(--k-pp)}.blk.neg{--bc:var(--k-exp)}.blk.gone{opacity:.28;text-decoration:line-through;box-shadow:none}.blk.sm{min-width:1.5em;height:1.5em;font-size:.85em}
.times{font-weight:bold;color:var(--ink2)}
@keyframes blkin{0%{transform:translateY(-1.3em) scale(.4);opacity:0}100%{transform:none;opacity:1}}
.row{display:flex;flex-wrap:wrap;gap:.5em;align-items:center}
.res{font-size:1.25em;font-weight:bold;margin:.3em 0}
.cmpg{display:grid;grid-template-columns:1fr 1fr;gap:.4em}
@media(max-width:500px){.cmpg{grid-template-columns:1fr}}
.card2{border:2px solid var(--line);border-radius:12px;padding:.4em .5em;background:var(--paper2);text-align:center}
.stair{display:flex;flex-wrap:wrap;align-items:flex-end;gap:.2em .1em}
.stp{display:flex;align-items:center;gap:.1em}
.scard{min-width:4.2em;text-align:center;border-radius:10px;border:2px solid var(--k-base);background:var(--paper);padding:.25em .3em;animation:blkin .4s both;box-shadow:0 .25em 0 rgba(0,0,0,.18)}
.scard.z{border-color:var(--k-ten)}.scard.n{border-color:var(--k-exp)}
.scard small{display:block;color:var(--ink2)}
.arr{font-size:.75em;color:var(--ink2);font-weight:bold;text-align:center;min-width:2.1em}
/* numération */
.pvt{position:relative;margin:.4em 0}
.pvt .head,.pvt .rw{position:relative;display:grid;grid-template-columns:repeat(15,1fr);}
.pvt .head span{font-size:.7em;text-align:center;color:var(--ink2);border-bottom:2px solid var(--k-ten);padding-bottom:.1em;line-height:1.1}
.pvt .head span.z{color:var(--k-ten);font-weight:bold}
.pvt .rw{height:2.3em;border-bottom:1px solid var(--line);background:repeating-linear-gradient(90deg,transparent 0 calc(100%/15 - 1px),var(--line) calc(100%/15 - 1px) calc(100%/15))}
.pvt .dg{position:absolute;top:0;width:calc(100%/15);text-align:center;font-weight:bold;font-size:1.3em;line-height:1.75em;transition:left .7s cubic-bezier(.4,.1,.2,1)}
.pvt .rw.o .dg{color:var(--ink2);opacity:.7}.pvt .rw.s .dg{color:var(--k-ten)}
.pvt .vir{position:absolute;top:.15em;font-size:1.6em;font-weight:bold;color:var(--k-sci);pointer-events:none}
.pvt .lab{font-size:.75em;color:var(--ink2);margin:.1em 0}
/* normaliseur */
.norm{display:flex;align-items:flex-end;justify-content:center;margin:.5em 0;padding:.3em 0;overflow:hidden}
.nc{flex:1 1 0;max-width:2em;min-width:0;text-align:center;font-weight:bold;font-size:clamp(.95em,4.4vw,1.55em);color:var(--ink);font-family:"Courier New",monospace;border-bottom:3px solid var(--line)}
.nc.pad{color:var(--ink2);opacity:.45}
.ng{flex:0 0 .55em;width:.55em;max-width:.8em;border:0;background:transparent;padding:0;min-height:2.2em;color:var(--k-sci);font-weight:bold;font-size:1.5em;line-height:1.1;cursor:pointer;position:relative}
.ng.on{flex-basis:.9em;width:.9em;max-width:none}
.ng:not(.on)::after{content:"";position:absolute;left:50%;bottom:.2em;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--line)}
.ng:not(.on):hover::after{background:var(--k-sci);width:7px;height:7px;margin-left:-3.5px}
.badge{display:inline-block;border-radius:1em;padding:.15em .8em;font-weight:bold;font-size:.9em}
.badge.ok{background:var(--ok);border:2px solid var(--ok-b)}.badge.soft{background:var(--soft);border:2px solid var(--soft-b)}
.svgb{width:100%;height:auto;display:block}
.sv-t{fill:var(--ink);font-family:var(--sans);font-size:11px}
.sv-l{stroke:var(--ink2);stroke-width:1}
.dots8{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;max-height:10.5em;overflow:hidden;margin:.3em 0}
.bact{width:var(--bd,14px);height:var(--bd,14px);border-radius:50%;background:radial-gradient(circle at 35% 30%,#d8f0a0,#6da31d);box-shadow:0 1px 1px rgba(0,0,0,.35);animation:blkin .35s both}
.frise{display:flex;justify-content:space-between;font-size:.7em;color:var(--ink2);border-top:3px solid var(--line);margin-top:.4em;padding-top:.2em}
.frise span{position:relative;text-align:center;flex:1}
.frise span.on{color:var(--k-base);font-weight:bold}
.frise span::before{content:"";position:absolute;left:50%;top:-.75em;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;background:var(--line)}
.frise span.on::before{background:var(--k-base)}
canvas.cv{width:100%;height:auto;display:block;border-radius:12px;background:linear-gradient(180deg,#d8f1f9,#f4fbf4);border:2px solid var(--line)}
:root[data-theme="dark"] canvas.cv{background:linear-gradient(180deg,#14303a,#1b2a22)}
.ord{display:flex;flex-wrap:wrap;gap:.4em}
.ordc{min-height:40px;border:2px solid var(--k-sci);background:var(--paper);color:var(--ink);border-radius:12px;padding:.2em .6em;font-weight:bold}
.ordc.used{opacity:.35}
.seq{min-height:2.6em;border:2px dashed var(--line);border-radius:12px;padding:.3em;display:flex;gap:.3em;flex-wrap:wrap;align-items:center;margin:.4em 0}
.seq .ordc{border-color:var(--ok-b)}
/* prefixes */
.pfx{display:grid;grid-template-columns:repeat(5,1fr);gap:.3em;margin:.3em 0}
.pfx .opt{min-height:3.6em;padding:.1em;text-align:center;font-size:.82em;line-height:1.2}
.pfx small{display:block;font-weight:normal}
table.t{border-collapse:collapse;width:100%;font-size:.85em;text-align:center}
table.t td,table.t th{border:2px solid var(--cb);padding:.2em .15em}
table.t th{background:var(--bleu-c);color:var(--ink)}
.tbl5{width:100%;border-collapse:collapse;text-align:center;font-size:.85em;margin:.3em 0}
.tbl5 td,.tbl5 th{border:2px solid var(--cb);padding:.15em .1em}
.tbl5 th{background:var(--bleu-c)}
/* bilan */
.bar{height:1em;background:var(--gris-c);border-radius:1em;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--vert),var(--bleu));transition:width .8s}
.stars{font-size:2em;letter-spacing:.1em;color:var(--gris-c);text-shadow:0 1px 0 var(--line)}
.stars b{color:var(--jaune);text-shadow:0 2px 0 var(--ombre-j)}
.cmpr{display:grid;grid-template-columns:7.5em 1fr 3.4em;gap:.4em;align-items:center;margin:.35em 0;font-size:.9em}
.scorebig{font-family:var(--serif);font-size:2.6em;font-weight:bold;color:var(--cb);line-height:1}
:root[data-theme="dark"] .scorebig{color:#7cc0ff}
.goto{display:inline-block}
/* sommaire */
.toc{display:grid;gap:.45em;margin:.5em 0}
.toc button{display:flex;align-items:center;gap:.7em;text-align:left;border:2px solid var(--line);background:var(--paper2);border-radius:14px;padding:.5em .7em;min-height:48px}
.toc button:hover{border-color:var(--bleu)}
.toc .n{flex:0 0 2em;height:2em;border-radius:50%;background:var(--cb);color:#fff;font-weight:bold;display:flex;align-items:center;justify-content:center}
.toc small{display:block;color:var(--ink2)}
/* feuille qui tourne */
.leaf{position:absolute;top:0;height:100%;z-index:20;transform-style:preserve-3d;pointer-events:none}
.strip{position:absolute;top:0;height:100%;transform-style:preserve-3d}
.face{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--paper)}
.face.bk{transform:rotateY(180deg)}
.face .clone{position:absolute;top:0;height:100%}
.face .shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(0,0,0,0) 60%,rgba(255,255,255,.15))}
.under{position:absolute;inset:0;pointer-events:none;z-index:15;background:linear-gradient(90deg,rgba(0,0,0,.3),transparent 55%);opacity:0}
.pgwrap.l .under{background:linear-gradient(270deg,rgba(0,0,0,.3),transparent 55%)}
/* navigation */
#nav{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:8px;padding:4px 10px 8px;z-index:40;flex-wrap:wrap}
.nbtn.pv{order:1}.chaps{order:2}#pgi{order:3}.nbtn.nx{order:4}
.nbtn{min-width:48px;min-height:48px;border-radius:50%;border:0;background:var(--jaune);color:#2E2E2D;font-size:1.4rem;font-weight:bold;box-shadow:0 4px 0 var(--ombre-j),0 6px 10px rgba(0,0,0,.4)}
.nbtn[disabled]{opacity:.4;box-shadow:none}
.chaps{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.cbtn{min-width:44px;min-height:44px;border-radius:14px;border:2px solid rgba(255,255,255,.7);background:rgba(255,255,255,.14);color:#fff;font-weight:bold;padding:0 10px}
.cbtn[aria-current="true"]{background:#fff;color:#222;border-color:var(--jaune);box-shadow:0 0 0 3px var(--jaune)}
#pgi{color:#fff;font-size:.85rem;min-width:7em;text-align:center}
/* panneau enseignant */
#tp{position:fixed;top:56px;right:10px;width:min(340px,calc(100vw - 20px));max-height:calc(100dvh - 130px);overflow:auto;background:var(--paper);color:var(--ink);border:3px solid var(--cj);border-radius:18px;padding:.8em 1em;z-index:80;box-shadow:0 12px 30px rgba(0,0,0,.5);display:none}
#tp.on{display:block}
#tp h4{margin:.2em 0 .4em;font-family:var(--serif);font-size:1.1rem}
#tp label{display:flex;align-items:center;gap:.6em;min-height:44px;font-weight:bold;font-size:.92rem}
#tp input[type=checkbox]{width:22px;height:22px;accent-color:var(--bleu)}
#tp ol{padding-left:1.2em;font-size:.82rem;line-height:1.4}
#tp li{margin:.35em 0}
#tp .kd{font-size:.78rem}
/* modes */
body.zoom{--z:1.22}
body.hideexpl .expl{display:none!important}
.tr .expl{display:none}
@media(max-width:979px){
  .btn,.chip,.opt{min-height:44px}
  input.fld,select.fld{min-height:44px}
  .ph{min-height:2.8em}
}
@media(max-width:979px){
  #nav{padding:2px 8px 6px;gap:4px 8px}
  .nbtn{min-width:44px;min-height:44px;font-size:1.2rem}
  #pgi{order:2;flex:1;min-width:0}.nbtn.nx{order:3}.chaps{order:4;flex:1 0 100%;gap:4px}
  .cbtn{min-width:40px;min-height:40px;padding:0 8px;flex:1 1 0}
  #bar{padding:4px 8px;gap:6px}
  #bar img{margin-right:auto}#bar .ttl{display:none}
  #stage{padding:6px 6px 2px}
}
@media(max-width:560px){
  #bar .ttl{font-size:.9rem}
  .tb span.lbt{display:none}
  .pb{padding:.5em .75em .8em}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media print{#bar,#nav,#tp{display:none}body{overflow:visible;background:#fff}}

input.fld.sup{width:3em;font-size:.82em;position:relative;top:-.6em;min-height:30px;padding:0;margin-right:.2em}

</style>

function stats(){
  const per={};for(const k in COMP)per[k]={pts:0,max:0,done:0,n:0,first:0,help:0,rev:0};
  let pts=0,max=0,done=0,n=0,first=0,help=0,rev=0;
  for(const id in REG){
    const r=REG[id],st=S.items[id],t=per[r.tag];if(!t)continue;
    t.max+=r.w;t.n++;max+=r.w;n++;
    if(st&&st.done){const sc=st.score||0;t.pts+=r.w*sc;pts+=r.w*sc;t.done++;done++;
      if(st.rev){t.rev++;rev++}else if(sc===1){t.first++;first++}else{t.help++;help++}}
  }
  return{per,pts,max,done,n,first,help,rev,score:max?Math.round(100*pts/max):0,prog:n?Math.round(100*done/n):0};
}

const SPECS={};
function itemDef(spec){reg(spec.id,spec.tag,spec.w==null?1:spec.w);SPECS[spec.id]=spec;return spec}
const OKS=['Bravo !','Bien joué !','C’est juste !','Très bien !'];
function Item(spec,opt){
  opt=opt||{};
  const st=ST(spec.id);
  const root=h('div',{class:'item'+(st.done?' done':'')+(spec.cls?' '+spec.cls:''),'data-id':spec.id});
  const qEl=h('div',{class:'q'});
  const ctl={};
  const choice=spec.type==='choice'||spec.type==='vf';
  const fb=h('div',{'aria-live':'polite'});
  const helpBox=h('div');
  const acts=h('div',{class:'acts'});
  function lock(){Object.values(ctl).forEach(c=>{(c.els||[c]).forEach(e=>e.disabled=true)})}
  function getRaw(){
    const raw={};
    for(const k in (spec.f||{})){
      const f=spec.f[k];
      if(f.t==='chk')raw[k]=ctl[k].els.filter(e=>e.checked).map(e=>e.value).sort().join(',');
      else raw[k]=ctl[k].value.trim();
    }
    return raw;
  }
  function parseAll(raw){const Pp={};for(const k in (spec.f||{})){const f=spec.f[k];Pp[k]=(f.t==='n'||f.t==='i')?parseQ(raw[k]):raw[k]}return Pp}
  function judge(raw,Pp){
    if(spec.accept)return spec.accept(raw,Pp);
    const per={};let ok=true;
    for(const k in spec.f){const f=spec.f[k];let good;
      if(f.t==='n'||f.t==='i'){const a=toQ(f.ans);good=!!(Pp[k]&&a&&Pp[k].eq(a))}
      else if(f.t==='sel')good=raw[k]===String(f.ans);
      else if(f.t==='chk')good=raw[k]===[].concat(f.ans).map(String).sort().join(',');
      per[k]=good;if(!good)ok=false}
    return{ok,per};
  }
  function fillAnswers(){
    for(const k in (spec.f||{})){const f=spec.f[k],c=ctl[k];
      if(f.t==='n'||f.t==='i'){const a=toQ(f.ans);c.value=a?(a.isInt()?a.n.toString().replace('-','−'):fmtDec(a)):String(f.ans)}
      else if(f.t==='sel')c.value=String(f.ans);
      else if(f.t==='chk'){const A=[].concat(f.ans).map(String);c.els.forEach(e=>e.checked=A.indexOf(e.value)>=0);st.vals[k]=A.slice().sort().join(',');continue}
      st.vals[k]=c.value;c.classList&&c.classList.add('good')}
  }
  function success(){
    st.done=true;st.rev=false;st.score=(st.tries===0&&st.help===0)?1:.5;sfx.ok();
    root.classList.add('done');lock();
    fb.replaceChildren(h('div',{class:'fb ok'},h('b',{},OKS[Math.floor(Math.random()*OKS.length)]+' '),h('span',{class:'expl',html:m(spec.sol||'')})));
    helpBox.replaceChildren();actsDisable();
    changed();opt.onChange&&opt.onChange();
  }
  function actsDisable(){$$('.hb',acts).forEach(b=>b.disabled=true);const v=$('.chk',acts);if(v)v.disabled=true}
  function fail(raw,Pp,per){
    st.tries++;const dg=spec.diag?spec.diag(raw,Pp):null;
    logErr(dg?dg[0]:'gen',spec.id);
    if(per)for(const k in per){const c=ctl[k];if(c&&c.classList){c.classList.toggle('good',!!per[k]);c.classList.toggle('soft',!per[k])}}
    const parts=[h('b',{},'Pas tout à fait. ')];
    if(dg)parts.push(h('span',{html:m(dg[1])}));else parts.push('Relis la consigne et réessaie.');
    const kids=[...parts];
    const wb=h('button',{class:'btn sm',type:'button',style:{marginLeft:'.4em'},onclick:()=>{
      helpBox.replaceChildren(h('div',{class:'help'},h('b',{},'Où est mon erreur ? '),h('span',{html:m(spec.where||spec.hint||'Vérifie chaque étape de ton calcul.')})))}},'Où est mon erreur ?');
    kids.push(wb);
    if(st.tries>=2&&!st.help)kids.push(h('span',{},' Tu peux aussi demander un indice.'));
    fb.replaceChildren(h('div',{class:'fb soft'},...kids));
    save();opt.onChange&&opt.onChange();
  }
  function check(){
    if(st.done)return;
    const raw=getRaw();
    for(const k in (spec.f||{})){const f=spec.f[k];if(f.t!=='chk'&&raw[k]===''){fb.replaceChildren(h('div',{class:'fb soft'},'Complète toutes les cases avant de vérifier.'));return}}
    Object.assign(st.vals,raw);
    const Pp=parseAll(raw),r=judge(raw,Pp);
    if(r.ok)success();else fail(raw,Pp,r.per);
  }
  /* champs */
  function mkField(k,f){
    if(f.t==='n'||f.t==='i'){
      const el=h('input',{class:'fld '+(f.cls||''),type:'text',inputmode:'text',autocomplete:'off',autocapitalize:'off',spellcheck:'false','aria-label':f.label||'Réponse',value:st.vals[k]||''});
      el.addEventListener('input',()=>{st.vals[k]=el.value;el.classList.remove('soft');save()});
      el.addEventListener('keydown',e=>{if(e.key==='Enter')check()});
      ctl[k]=el;return el;
    }
    if(f.t==='sel'){
      const el=h('select',{class:'fld','aria-label':f.label||'Choix'},h('option',{value:''},'…'),...f.opts.map(o=>h('option',{value:o},o)));
      el.value=st.vals[k]||'';
      el.addEventListener('change',()=>{st.vals[k]=el.value;el.classList.remove('soft');save()});
      ctl[k]=el;return el;
    }
    if(f.t==='chk'){
      const wrap=h('span',{class:'opts'});const els=[];
      f.opts.forEach((o,i)=>{const cb=h('input',{type:'checkbox',value:String(i),id:spec.id+k+i});if((st.vals[k]||'').split(',').indexOf(String(i))>=0)cb.checked=true;cb.addEventListener('change',()=>{st.vals[k]=els.filter(e=>e.checked).map(e=>e.value).sort().join(',');save()});els.push(cb);wrap.append(h('label',{class:'opt',for:spec.id+k+i,style:{display:'inline-flex',gap:'.4em',alignItems:'center'}},cb,h('span',{html:m(o)})))});
      ctl[k]={els};return wrap;
    }
  }
  if(spec.q){
    spec.q.split(/(\[\[\w+\]\])/).forEach(p=>{
      const mm=p.match(/^\[\[(\w+)\]\]$/);
      if(mm)qEl.append(mkField(mm[1],spec.f[mm[1]]));else if(p)qEl.append(h('span',{html:m(p)}));
    });
  }
  root.append(qEl);
  if(choice){
    const opts=spec.type==='vf'?['Vrai','Faux']:spec.opts;
    const ow=h('div',{class:'opts',style:{marginTop:'.3em'}});
    opts.forEach((o,i)=>{
      const b=h('button',{class:'opt',type:'button',html:m(o)});
      b.addEventListener('click',()=>{
        if(st.done)return;
        const ans=spec.type==='vf'?(spec.ans?0:1):spec.ans;
        if(i===ans){st.pick=i;b.classList.add('good');success();$$('.opt',ow).forEach(x=>x.disabled=true)}
        else{st.tries++;b.classList.add('try');const dg=spec.diag?spec.diag(i):null;logErr(dg?dg[0]:'gen',spec.id);
          const kids=[h('b',{},'Pas tout à fait. ')];if(dg)kids.push(h('span',{html:m(dg[1])}));else kids.push('Réfléchis encore.');
          kids.push(h('button',{class:'btn sm',type:'button',style:{marginLeft:'.4em'},onclick:()=>{helpBox.replaceChildren(h('div',{class:'help'},h('b',{},'Où est mon erreur ? '),h('span',{html:m(spec.where||spec.hint||'Vérifie en calculant.')})))}},'Où est mon erreur ?'));
          fb.replaceChildren(h('div',{class:'fb soft'},...kids));save();opt.onChange&&opt.onChange()}
      });
      if(st.done){b.disabled=true;const ans=spec.type==='vf'?(spec.ans?0:1):spec.ans;if(i===ans)b.classList.add('good')}
      ow.append(b);
    });
    root.append(ow);ctl._opts={els:$$('.opt',ow)};
  }
  root.append(fb,helpBox,acts);
  if(spec.f&&!choice){acts.append(h('button',{class:'btn pri sm chk',type:'button',onclick:check},'Vérifier'))}
  const lv=[['Indice',1,spec.hint],['Méthode',2,spec.method],['Correction',3,spec.sol]];
  let armed=false;
  lv.forEach(([nm,n,txt])=>{
    if(!txt&&n<3)return;
    const b=h('button',{class:'btn sm hb',type:'button','aria-expanded':'false'},nm);
    b.addEventListener('click',()=>{
      if(st.done&&!st.rev)return;
      if(n===3&&!armed&&!st.rev){armed=true;b.textContent='Confirmer la correction ?';setTimeout(()=>{if(armed&&!st.rev){armed=false;b.textContent='Correction'}},3500);return}
      if(n===3){
        st.rev=true;st.done=true;st.score=0;root.classList.add('done');
        if(spec.f)fillAnswers();
        if(choice){const ans=spec.type==='vf'?(spec.ans?0:1):spec.ans;$$('.opt',ctl._opts?root:root).forEach((x,i)=>{x.disabled=true;if(i===ans)x.classList.add('good')})}
        lock();fb.replaceChildren();
        helpBox.replaceChildren(h('div',{class:'help'},h('b',{},'Correction : '),h('span',{class:'expl',html:m(spec.sol)})));
        actsDisable();changed();opt.onChange&&opt.onChange();return;
      }
      st.help=Math.max(st.help,n);save();
      helpBox.replaceChildren(h('div',{class:'help'},h('b',{},nm+' : '),h('span',{html:m(txt)})));
    });
    acts.append(b);
  });
  if(st.done){
    if(st.rev){
      if(spec.f){fillAnswers()}
      helpBox.replaceChildren(h('div',{class:'help'},h('b',{},'Correction : '),h('span',{class:'expl',html:m(spec.sol)})));
    }else{
      if(spec.f){for(const k in spec.f){ctl[k]&&ctl[k].classList&&ctl[k].classList.add('good')}}
      fb.replaceChildren(h('div',{class:'fb ok'},h('b',{},'Réussi. '),h('span',{class:'expl',html:m(spec.sol||'')})));
    }
    lock();actsDisable();
  }
  return root;
}

};

const NSP=SP.length;
const reduce=()=>window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const run=(dur,fn)=>new Promise(res=>{if(reduce()){fn(1);res();return}const t0=performance.now();const f=now=>{const p=Math.min(1,(now-t0)/dur);fn(p);if(p<1)requestAnimationFrame(f);else res()};requestAnimationFrame(f)});

let bookEl,Lw,Rw,navEls={};
function setPage(wrap,node){const old=$('.pg',wrap);if(old)old.remove();if(node)wrap.insertBefore(node,wrap.firstChild)}
function flatInfo(p){return{i:p>>1,side:(p&1)?'R':'L'}}
function curPageIdx(){return S.single?S.page:S.spread*2}

function mount(){

function fit(){

/* feuille qui tourne : deux bandes pour simuler la courbure du papier */
function makeLeaf(front,back,pw,H,left){
  const half=pw/2;
  const leaf=h('div',{class:'leaf',style:{left:left+'px',width:pw+'px',transformOrigin:'0 50%'}});
  const s1=h('div',{class:'strip',style:{left:'0',width:half+'px',transformOrigin:'0 50%'}});
  const s2=h('div',{class:'strip',style:{left:half+'px',width:half+'px',transformOrigin:'0 50%'}});
  const shades=[];
  const mk=(node,off,bk)=>{
    const f=h('div',{class:'face'+(bk?' bk':'')});
    const c=node.cloneNode(true);c.classList.add('clone');c.style.cssText=`position:absolute;top:0;height:${H}px;width:${pw}px;left:${off}px;`;
    const sh=h('div',{class:'shade'});shades.push(sh);f.append(c,sh);return f;
  };
  s1.append(mk(front,0,false),mk(back,-half,true));
  s2.append(mk(front,-half,false),mk(back,0,true));
  s1.append(s2);leaf.append(s1);
  return{el:leaf,set(a){const t=Math.abs(a)/180;leaf.style.transform=`translateZ(1px) rotateY(${a}deg)`;s2.style.transform=`rotateY(${(18*Math.sin(Math.PI*t)).toFixed(2)}deg)`;const o=(.6*Math.sin(Math.PI*t)).toFixed(3);shades.forEach(x=>x.style.opacity=o)}};
}
async function flipSpread(dir){
  if(S.busy)return;S.busy=true;sfx.flip();
  const pw=bookEl.clientWidth/2,H=bookEl.clientHeight;
  const cur=S.spread,nxt=cur+dir;
  const uL=$('.under',Lw),uR=$('.under',Rw);
  let leaf;
  try{
    if(dir>0){
      const front=build(cur,'R'),back=build(nxt,'L');
      setPage(Rw,build(nxt,'R'));
      leaf=makeLeaf(front,back,pw,H,pw);bookEl.append(leaf.el);leaf.set(0);
      await run(950,p=>{const e=ease(p);leaf.set(-180*e);uR.style.opacity=(.55*(1-e)).toFixed(3);uL.style.opacity=(.5*e).toFixed(3)});
      setPage(Lw,build(nxt,'L'));
    }else{
      const front=build(nxt,'R'),back=build(cur,'L');
      setPage(Lw,build(nxt,'L'));
      leaf=makeLeaf(front,back,pw,H,pw);bookEl.append(leaf.el);leaf.set(-180);
      await run(950,p=>{const e=ease(p);leaf.set(-180*(1-e));uR.style.opacity=(.55*e).toFixed(3);uL.style.opacity=(.5*(1-e)).toFixed(3)});
      setPage(Rw,build(nxt,'R'));
    }
  }finally{
    if(leaf)leaf.el.remove();uL.style.opacity=0;uR.style.opacity=0;
    S.spread=nxt;S.busy=false;updateNav();
  }
}
async function flipSingle(dir){

async function fadeTo(fn){
  if(S.busy)return;S.busy=true;
  bookEl.style.transition='opacity .18s';bookEl.style.opacity='0';
  await new Promise(r=>setTimeout(r,reduce()?0:190));
  fn();bookEl.style.opacity='1';
  await new Promise(r=>setTimeout(r,reduce()?0:190));
  bookEl.style.transition='';S.busy=false;

function go(i,force){
  i=Math.max(0,Math.min(NSP-1,i));
  if(S.busy)return;
  if(S.single){const p=i*2;if(p===S.page&&!force)return;fadeTo(()=>{S.page=p;S.spread=i;mount();$('.pb',Rw)&&($('.pb',Rw).scrollTop=0)});return}
  if(i===S.spread&&!force)return;
  if(!force&&Math.abs(i-S.spread)===1)flipSpread(i-S.spread);
  else fadeTo(()=>{S.spread=i;mount()});
}
function next(){if(S.single){if(S.page<NSP*2-1)flipSingle(1)}else if(S.spread<NSP-1)flipSpread(1)}
function prev(){if(S.single){if(S.page>0)flipSingle(-1)}else if(S.spread>0)flipSpread(-1)}

/* ---------- interface ---------- */
function applyTheme(){
  const r=document.documentElement;
  if(S.theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',S.theme);
}
function buildApp(){
  const app=h('div',{id:'app'});
  const bar=h('div',{id:'bar',role:'toolbar','aria-label':'Outils'});
  const bToc=h('button',{class:'tb',type:'button',title:'Sommaire',onclick:()=>go(0)},'☰ ',h('span',{class:'lbt'},'Sommaire'));
  const bSnd=h('button',{class:'tb',type:'button','aria-pressed':String(S.sound),title:'Bruitage',onclick:e=>{S.sound=!S.sound;e.currentTarget.setAttribute('aria-pressed',String(S.sound));save()}},'♪ ',h('span',{class:'lbt'},'Bruitage'));
  const bTh=h('button',{class:'tb',type:'button',title:'Mode sombre',onclick:()=>{S.theme=S.theme==='auto'?'dark':S.theme==='dark'?'light':'auto';applyTheme();bTh.querySelector('.lbt').textContent=' Thème : '+({auto:'auto',dark:'sombre',light:'clair'})[S.theme];save()}},h('span',{html:'<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 1.5a6.5 6.5 0 0 0 0 13z" fill="currentColor"/></svg>'}),h('span',{class:'lbt'},' Thème : '+({auto:'auto',dark:'sombre',light:'clair'})[S.theme]));
  const bTe=h('button',{class:'tb',type:'button','aria-pressed':'false','aria-controls':'tp',title:'Mode enseignant',onclick:e=>{const on=!$('#tp').classList.contains('on');$('#tp').classList.toggle('on',on);e.currentTarget.setAttribute('aria-pressed',String(on))}},'✎ ',h('span',{class:'lbt'},'Mode enseignant'));
  bar.append(h('img',{src:LOGO,alt:'Pazapa'}),h('span',{class:'ttl'},'Puissances d’un nombre · 3ᵉ'),bToc,bSnd,bTh,bTe);
  const stage=h('div',{id:'stage'});
  bookEl=h('div',{id:'book'});
  Lw=h('div',{class:'pgwrap l'},h('div',{class:'under'}));
  Rw=h('div',{class:'pgwrap r'},h('div',{class:'under'}));
  bookEl.append(h('div',{class:'shadow'}),Lw,Rw,h('div',{class:'spine'}));
  stage.append(bookEl);
  const nav=h('div',{id:'nav'});
  navEls.prev=h('button',{class:'nbtn pv',type:'button','aria-label':'Page précédente',onclick:prev},'◀');
  navEls.next=h('button',{class:'nbtn nx',type:'button','aria-label':'Page suivante',onclick:next},'▶');
  navEls.info=h('span',{id:'pgi','aria-live':'polite'});
  navEls.chaps=h('div',{class:'chaps'});
  [['Intro',0,0],['1',1,1],['2',3,2],['3',5,3],['4',7,4],['5',9,5],['Bilan',11,6]].forEach(([t,i,c])=>navEls.chaps.append(h('button',{class:'cbtn',type:'button','data-ch':c,'aria-label':c===0?'Introduction':c===6?'Bilan':'Chapitre '+t,onclick:()=>go(i)},t)));
  nav.append(navEls.prev,navEls.chaps,navEls.info,navEls.next);
  const tp=h('div',{id:'tp',role:'dialog','aria-label':'Mode enseignant'});
  const chk=(lbl,fn,init)=>h('label',{},h('input',{type:'checkbox',checked:init,onchange:e=>fn(e.target.checked)}),lbl);
  const notes=h('ol',{style:{display:'none'}},...NOTES.map(n=>h('li',{html:m(n)})));
  tp.append(h('h4',{},'Mode enseignant'),
    chk('Agrandir les modèles (projection au tableau)',v=>{S.zoom=v;document.body.classList.toggle('zoom',v);fit();mount()},false),
    chk('Masquer les explications',v=>{S.hide=v;document.body.classList.toggle('hideexpl',v)},false),
    h('div',{class:'row'},h('button',{class:'btn sm',type:'button',onclick:()=>{const d=document.documentElement;if(document.fullscreenElement)document.exitFullscreen();else if(d.requestFullscreen)d.requestFullscreen().catch(()=>{})}},'Plein écran'),
      h('button',{class:'btn sm',type:'button',onclick:()=>{notes.style.display=notes.style.display==='none'?'block':'none'}},'Notes sur le cahier'),
      h('button',{class:'btn sm',type:'button',onclick:()=>{$('#tp').classList.remove('on');bTe.setAttribute('aria-pressed','false')}},'Fermer')),
    h('div',{class:'kd',style:{margin:'.4em 0'}},'Incohérences repérées dans le cahier (pages 86 à 99) :'),notes);
  app.append(bar,stage,nav,tp);
  return app;
}
function bindInput(){
  document.addEventListener('keydown',e=>{
    const t=e.target;if(t&&(t.tagName==='INPUT'||t.tagName==='SELECT'||t.tagName==='TEXTAREA'))return;
    if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();next()}
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev()}
  });
  let sx=0,sy=0,st=0,ok=false;
  const stage=$('#stage');
  stage.addEventListener('pointerdown',e=>{ok=!e.target.closest('input,button,select,textarea,canvas,a,[data-noswipe],.flap');sx=e.clientX;sy=e.clientY;st=performance.now()});
  stage.addEventListener('pointerup',e=>{
    if(!ok)return;const dx=e.clientX-sx,dy=e.clientY-sy;
    if(Math.abs(dx)>60&&Math.abs(dx)>1.6*Math.abs(dy)&&performance.now()-st<900){if(dx<0)next();else prev()}
  });
  let rt=0;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(!S.busy)fit()},120)});
}
function init(){
  load();
  document.body.append(buildApp());
  applyTheme();
  const w=window.innerWidth;S.single=w<980;
  S.spread=Math.min(S.spread,NSP-1);S.page=S.spread*2;
  fit();
  mount();
  bindInput();
  window.PAZAPA_DEBUG={S,go,next,prev,stats,REG,SP,SPECS,Q,parseQ,toQ,fmtDec,m,sci,fit,mount,PFX};
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();


})();
</script>
